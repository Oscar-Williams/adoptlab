name: Verify contracts and integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,competitive]"
      - run: adoptlab doctor --target builtin
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/first-task-smoke'
      - run: adoptlab first-task
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/first-task-smoke'
      - run: python -m pytest -q
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/adoptlab'
      - run: python scripts/check_public_tree.py
      - run: python scripts/build_static_site.py
  container-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: adoptlab doctor --target builtin
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/first-task-smoke'
      - run: adoptlab first-task
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/first-task-smoke'
      - run: python -m pytest -q
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/adoptlab'
      - run: python scripts/prepare_filesystem.py
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/adoptlab'
      - run: python scripts/verify_filesystem.py --protocol-only
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/adoptlab'
