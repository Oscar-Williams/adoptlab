name: Verify contracts and integration
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,competitive]"
      - run: python -m pytest -q
        env:
          ADOPTLAB_RUNTIME: '${{ runner.temp }}/adoptlab'
      - run: python scripts/check_public_tree.py
