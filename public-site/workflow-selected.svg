r-end="url(#arrow)" /><text x="138" y="3300.0" font-size="16"><tspan x="138" dy="0">处理后</tspan></text><g id="END"><rect x="1200" y="4470" width="700" height="90" rx="40" fill="white" stroke="#64748b" /><text x="1230" y="4506" font-size="18"><tspan x="1230" dy="0">结束 · 发布证据与持续维护</tspan></text></g><path d="M1550.0 4330 V4400.0 H1550.0 V4465" fill="none" stroke="#64748b" marker-end="url(#arrow)" /><g id="GOLD"><rect x="200" y="2750" width="750" height="100" rx="6" fill="white" stroke="#64748b" /><text x="230" y="2786" font-size="18"><tspan x="230" dy="0">独立Gold与验证规则</tspan><tspan x="230" dy="27.0">输入字段、集合、范围及引用位置</tspan></text></g><path d="M575.0 2850 V2770.0 H1550.0 V2685" fill="none" stroke="#64748b" marker-end="url(#arrow)" /><text x="1074.5" y="2762.0" font-size="16"><tspan x="1074.5" dy="0">仅验收使用</tspan></text><g id="CASE-1"><rect x="2300" y="3000" width="1500" height="160" rx="6" fill="white" stroke="#64748b" /><text x="2330" y="3036" font-size="18"><tspan x="2330" dy="0">C1 内置记录</tspan><tspan x="2330" dy="27.0">输入记录 → MCP读取/转换 → 写产物 → 字段与集合验收</tspan><tspan x="2330" dy="27.0">均连接ND-13至ND-18的修订与发布闭环。</tspan></text></g><g id="CASE-2"><rect x="2300" y="3250" width="1500" height="160" rx="6" fill="white" stroke="#64748b" /><text x="2330" y="3286" font-size="18"><tspan x="2330" dy="0">C2 Filesystem证据</tspan><tspan x="2330" dy="27.0">固定镜像 → read_text_file → write_file → 证据引用规则</tspan><tspan x="2330" dy="27.0">均连接ND-13至ND-18的修订与发布闭环。</tspan></text></g><g id="CASE-3"><rect x="2300" y="3500" width="1500" height="160" rx="6" fill="white" stroke="#64748b" /><text x="2330" y="3536" font-size="18"><tspan x="2330" dy="0">C3 配置与引用</tspan><tspan x="2330" dy="27.0">配置文档 → endpoint、retry_limit、citation_line → 逐字段验收</tspan><tspan x="2330" dy="27.0">均连接ND-13至ND-18的修订与发布闭环。</tspan></text></g></g></svg>