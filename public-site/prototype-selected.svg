<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="3270" viewBox="0 0 1540 3270" font-family="Microsoft YaHei,Arial,sans-serif" fill="#19353f"><title>AdoptLab 0.5 selected editable prototypes</title><g id="UI-04" transform="translate(50,50)"><rect width="1440" height="1000" rx="12" fill="white" stroke="#c9dce2" /><rect width="232" height="1000" fill="#e8f0f2" /><text x="24" y="44" font-size="24"><tspan x="24" dy="0">AdoptLab</tspan></text><text x="264" y="44" font-size="30"><tspan x="264" dy="0">UI-04 / 任务契约编辑</tspan></text><text x="264" y="92" font-size="20"><tspan x="264" dy="0">把任务描述转为可独立验收契约</tspan></text><text x="24" y="100" font-size="16"><tspan x="24" dy="0">01 工作台概览</tspan></text><text x="24" y="143" font-size="16"><tspan x="24" dy="0">02 环境检查</tspan></text><text x="24" y="186" font-size="16"><tspan x="24" dy="0">03 MCP与任务目录</tspan></text><text x="24" y="229" font-size="16"><tspan x="24" dy="0">04 任务契约编辑</tspan></text><text x="24" y="272" font-size="16"><tspan x="24" dy="0">05 实验配置</tspan></text><text x="24" y="315" font-size="16"><tspan x="24" dy="0">06 实验结果比较</tspan></text><text x="24" y="358" font-size="16"><tspan x="24" dy="0">07 运行历史</tspan></text><text x="24" y="401" font-size="16"><tspan x="24" dy="0">08 运行详情与诊断</tspan></text><text x="24" y="444" font-size="16"><tspan x="24" dy="0">09 材料与版本差异</tspan></text><text x="24" y="487" font-size="16"><tspan x="24" dy="0">10 反馈与修订</tspan></text><text x="24" y="530" font-size="16"><tspan x="24" dy="0">11 发布检查与导出</tspan></text><text x="24" y="573" font-size="16"><tspan x="24" dy="0">12 开发者首次任务</tspan></text><text x="24" y="616" font-size="16"><tspan x="24" dy="0">13 使用观察与指标</tspan></text><text x="24" y="659" font-size="16"><tspan x="24" dy="0">14 公开案例与作品</tspan></text><g id="UI-04-E01"><rect x="264" y="136" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="162" font-size="18"><tspan x="280" dy="0">E01  Task ID</tspan></text><text x="280" y="189" font-size="14"><tspan x="280" dy="0">字符串，使用合法ID</tspan></text></g><g id="UI-04-E02"><rect x="830" y="136" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="162" font-size="18"><tspan x="846" dy="0">E02  任务族</tspan></text><text x="846" y="189" font-size="14"><tspan x="846" dy="0">任务family用于同类场景分组，随不可变任务包保存。</tspan></text></g><g id="UI-04-E03"><rect x="264" y="224" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="250" font-size="18"><tspan x="280" dy="0">E03  Profile</tspan></text><text x="280" y="277" font-size="14"><tspan x="280" dy="0">从已登记profile选择</tspan></text></g><g id="UI-04-E04"><rect x="830" y="224" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="250" font-size="18"><tspan x="846" dy="0">E04  数据划分</tspan></text><text x="846" y="277" font-size="14"><tspan x="846" dy="0">exploration或holdout</tspan></text></g><g id="UI-04-E05"><rect x="264" y="312" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="338" font-size="18"><tspan x="280" dy="0">E05  公开任务说明</tspan></text><text x="280" y="365" font-size="14"><tspan x="280" dy="0">进入被测模型的任务上下文</tspan></text></g><g id="UI-04-E06"><rect x="830" y="312" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="338" font-size="18"><tspan x="846" dy="0">E06  输入夹具JSON</tspan></text><text x="846" y="365" font-size="14"><tspan x="846" dy="0">合法JSON对象</tspan></text></g><g id="UI-04-E07"><rect x="264" y="400" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="426" font-size="18"><tspan x="280" dy="0">E07  输出文件</tspan></text><text x="280" y="453" font-size="14"><tspan x="280" dy="0">任务输出目录内安全相对文件名</tspan></text></g><g id="UI-04-E08"><rect x="830" y="400" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="426" font-size="18"><tspan x="846" dy="0">E08  规则操作</tspan></text><text x="846" y="453" font-size="14"><tspan x="846" dy="0">exists、equals、contains、set_equals、</tspan><tspan x="846" dy="21.0">…</tspan></text></g><g id="UI-04-E09"><rect x="264" y="488" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="514" font-size="18"><tspan x="280" dy="0">E09  JSON路径</tspan></text><text x="280" y="541" font-size="14"><tspan x="280" dy="0">JSON数组</tspan></text></g><g id="UI-04-E10"><rect x="830" y="488" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="514" font-size="18"><tspan x="846" dy="0">E10  预期值</tspan></text><text x="846" y="541" font-size="14"><tspan x="846" dy="0">按操作使用expected/type/min/max，有限数值与准确</tspan><tspan x="846" dy="21.0">…</tspan></text></g><g id="UI-04-E11"><rect x="264" y="576" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="602" font-size="18"><tspan x="280" dy="0">E11  协议步骤JSON</tspan></text><text x="280" y="629" font-size="14"><tspan x="280" dy="0">参考工具步骤只用于protocol</tspan></text></g><g id="UI-04-E12"><rect x="830" y="576" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="602" font-size="18"><tspan x="846" dy="0">E12  导入JSON</tspan></text><text x="846" y="629" font-size="14"><tspan x="846" dy="0">保留原始文本</tspan></text></g><g id="UI-04-E13"><rect x="264" y="664" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="690" font-size="18"><tspan x="280" dy="0">E13  增加规则</tspan></text><text x="280" y="717" font-size="14"><tspan x="280" dy="0">追加一条file/op/path/expected规则</tspan></text></g><g id="UI-04-E14"><rect x="830" y="664" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="690" font-size="18"><tspan x="846" dy="0">E14  预检契约</tspan></text><text x="846" y="717" font-size="14"><tspan x="846" dy="0">检查字段、依赖、路径、规则和匹配关系</tspan></text></g><g id="UI-04-E15"><rect x="264" y="752" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="778" font-size="18"><tspan x="280" dy="0">E15  预检并登记</tspan></text><text x="280" y="805" font-size="14"><tspan x="280" dy="0">先预检，再不可变登记</tspan></text></g><g id="UI-04-E16"><rect x="830" y="752" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="778" font-size="18"><tspan x="846" dy="0">E16  错误位置</tspan></text><text x="846" y="805" font-size="14"><tspan x="846" dy="0">语法错误提供行列与选区</tspan></text></g><text x="264" y="930" font-size="17"><tspan x="264" dy="0">AC-01 / AC-02 / AC-06 · 元素规则见PRD四列表</tspan></text></g><g id="UI-06" transform="translate(50,1130)"><rect width="1440" height="1000" rx="12" fill="white" stroke="#c9dce2" /><rect width="232" height="1000" fill="#e8f0f2" /><text x="24" y="44" font-size="24"><tspan x="24" dy="0">AdoptLab</tspan></text><text x="264" y="44" font-size="30"><tspan x="264" dy="0">UI-06 / 实验结果比较</tspan></text><text x="264" y="92" font-size="20"><tspan x="264" dy="0">在可比条件下解释材料差异</tspan></text><text x="24" y="100" font-size="16"><tspan x="24" dy="0">01 工作台概览</tspan></text><text x="24" y="143" font-size="16"><tspan x="24" dy="0">02 环境检查</tspan></text><text x="24" y="186" font-size="16"><tspan x="24" dy="0">03 MCP与任务目录</tspan></text><text x="24" y="229" font-size="16"><tspan x="24" dy="0">04 任务契约编辑</tspan></text><text x="24" y="272" font-size="16"><tspan x="24" dy="0">05 实验配置</tspan></text><text x="24" y="315" font-size="16"><tspan x="24" dy="0">06 实验结果比较</tspan></text><text x="24" y="358" font-size="16"><tspan x="24" dy="0">07 运行历史</tspan></text><text x="24" y="401" font-size="16"><tspan x="24" dy="0">08 运行详情与诊断</tspan></text><text x="24" y="444" font-size="16"><tspan x="24" dy="0">09 材料与版本差异</tspan></text><text x="24" y="487" font-size="16"><tspan x="24" dy="0">10 反馈与修订</tspan></text><text x="24" y="530" font-size="16"><tspan x="24" dy="0">11 发布检查与导出</tspan></text><text x="24" y="573" font-size="16"><tspan x="24" dy="0">12 开发者首次任务</tspan></text><text x="24" y="616" font-size="16"><tspan x="24" dy="0">13 使用观察与指标</tspan></text><text x="24" y="659" font-size="16"><tspan x="24" dy="0">14 公开案例与作品</tspan></text><g id="UI-06-E01"><rect x="264" y="136" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="162" font-size="18"><tspan x="280" dy="0">E01  来源分组</tspan></text><text x="280" y="189" font-size="14"><tspan x="280" dy="0">automation、human_unverified、human_</tspan><tspan x="280" dy="21.0">…</tspan></text></g><g id="UI-06-E02"><rect x="830" y="136" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="162" font-size="18"><tspan x="846" dy="0">E02  执行模式</tspan></text><text x="846" y="189" font-size="14"><tspan x="846" dy="0">protocol按参考步骤执行</tspan></text></g><g id="UI-06-E03"><rect x="264" y="224" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="250" font-size="18"><tspan x="280" dy="0">E03  Profile</tspan></text><text x="280" y="277" font-size="14"><tspan x="280" dy="0">从已登记profile选择</tspan></text></g><g id="UI-06-E04"><rect x="830" y="224" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="250" font-size="18"><tspan x="846" dy="0">E04  可比状态</tspan></text><text x="846" y="277" font-size="14"><tspan x="846" dy="0">按来源、模式、profile分组</tspan></text></g><g id="UI-06-E05"><rect x="264" y="312" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="338" font-size="18"><tspan x="280" dy="0">E05  材料版本</tspan></text><text x="280" y="365" font-size="14"><tspan x="280" dy="0">不可变材料ID、内容hash及父版本</tspan></text></g><g id="UI-06-E06"><rect x="830" y="312" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="338" font-size="18"><tspan x="846" dy="0">E06  接受与总数</tspan></text><text x="846" y="365" font-size="14"><tspan x="846" dy="0">分子为succeeded且verification.passed</tspan></text></g><g id="UI-06-E07"><rect x="264" y="400" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="426" font-size="18"><tspan x="280" dy="0">E07  正常任务</tspan></text><text x="280" y="453" font-size="14"><tspan x="280" dy="0">expected_error为空的任务，正常通过和计划数分别统计。</tspan></text></g><g id="UI-06-E08"><rect x="830" y="400" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="426" font-size="18"><tspan x="846" dy="0">E08  预期拒绝</tspan></text><text x="846" y="453" font-size="14"><tspan x="846" dy="0">expected_error存在的任务，正确拒绝由独立规则决定。</tspan></text></g><g id="UI-06-E09"><rect x="264" y="488" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="514" font-size="18"><tspan x="280" dy="0">E09  费用上界</tspan></text><text x="280" y="541" font-size="14"><tspan x="280" dy="0">所有charge的COALESCE(actual,reserved)</tspan><tspan x="280" dy="21.0">…</tspan></text></g><g id="UI-06-E10"><rect x="830" y="488" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="514" font-size="18"><tspan x="846" dy="0">E10  运行与条件</tspan></text><text x="846" y="541" font-size="14"><tspan x="846" dy="0">展示参与组的完整run_ids、条件哈希及balanced状态，支持</tspan><tspan x="846" dy="21.0">…</tspan></text></g><text x="264" y="930" font-size="17"><tspan x="264" dy="0">AC-07 / AC-11 · 元素规则见PRD四列表</tspan></text></g><g id="UI-10" transform="translate(50,2210)"><rect width="1440" height="1000" rx="12" fill="white" stroke="#c9dce2" /><rect width="232" height="1000" fill="#e8f0f2" /><text x="24" y="44" font-size="24"><tspan x="24" dy="0">AdoptLab</tspan></text><text x="264" y="44" font-size="30"><tspan x="264" dy="0">UI-10 / 反馈与修订</tspan></text><text x="264" y="92" font-size="20"><tspan x="264" dy="0">关联问题新材料及同条件复验</tspan></text><text x="24" y="100" font-size="16"><tspan x="24" dy="0">01 工作台概览</tspan></text><text x="24" y="143" font-size="16"><tspan x="24" dy="0">02 环境检查</tspan></text><text x="24" y="186" font-size="16"><tspan x="24" dy="0">03 MCP与任务目录</tspan></text><text x="24" y="229" font-size="16"><tspan x="24" dy="0">04 任务契约编辑</tspan></text><text x="24" y="272" font-size="16"><tspan x="24" dy="0">05 实验配置</tspan></text><text x="24" y="315" font-size="16"><tspan x="24" dy="0">06 实验结果比较</tspan></text><text x="24" y="358" font-size="16"><tspan x="24" dy="0">07 运行历史</tspan></text><text x="24" y="401" font-size="16"><tspan x="24" dy="0">08 运行详情与诊断</tspan></text><text x="24" y="444" font-size="16"><tspan x="24" dy="0">09 材料与版本差异</tspan></text><text x="24" y="487" font-size="16"><tspan x="24" dy="0">10 反馈与修订</tspan></text><text x="24" y="530" font-size="16"><tspan x="24" dy="0">11 发布检查与导出</tspan></text><text x="24" y="573" font-size="16"><tspan x="24" dy="0">12 开发者首次任务</tspan></text><text x="24" y="616" font-size="16"><tspan x="24" dy="0">13 使用观察与指标</tspan></text><text x="24" y="659" font-size="16"><tspan x="24" dy="0">14 公开案例与作品</tspan></text><g id="UI-10-E01"><rect x="264" y="136" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="162" font-size="18"><tspan x="280" dy="0">E01  当前运行</tspan></text><text x="280" y="189" font-size="14"><tspan x="280" dy="0">读取全局选择的完整run_id</tspan></text></g><g id="UI-10-E02"><rect x="830" y="136" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="162" font-size="18"><tspan x="846" dy="0">E02  问题与证据</tspan></text><text x="846" y="189" font-size="14"><tspan x="846" dy="0">必填1—2000字符，描述步骤、预期、实际及运行引用</tspan></text></g><g id="UI-10-E03"><rect x="264" y="224" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="250" font-size="18"><tspan x="280" dy="0">E03  保存反馈</tspan></text><text x="280" y="277" font-size="14"><tspan x="280" dy="0">一次提交使用稳定幂等键</tspan></text></g><g id="UI-10-E04"><rect x="830" y="224" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="250" font-size="18"><tspan x="846" dy="0">E04  反馈ID</tspan></text><text x="846" y="277" font-size="14"><tspan x="846" dy="0">不可变反馈记录，关联原运行和提交时间。</tspan></text></g><g id="UI-10-E05"><rect x="264" y="312" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="338" font-size="18"><tspan x="280" dy="0">E05  原反馈</tspan></text><text x="280" y="365" font-size="14"><tspan x="280" dy="0">从当前实验handoff.feedback选择，作为修订old_ru</tspan><tspan x="280" dy="21.0">…</tspan></text></g><g id="UI-10-E06"><rect x="830" y="312" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="338" font-size="18"><tspan x="846" dy="0">E06  新运行</tspan></text><text x="846" y="365" font-size="14"><tspan x="846" dy="0">候选为当前实验运行</tspan></text></g><g id="UI-10-E07"><rect x="264" y="400" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="426" font-size="18"><tspan x="280" dy="0">E07  决策理由</tspan></text><text x="280" y="453" font-size="14"><tspan x="280" dy="0">必填1—2000字符</tspan></text></g><g id="UI-10-E08"><rect x="830" y="400" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="426" font-size="18"><tspan x="846" dy="0">E08  关联复验</tspan></text><text x="846" y="453" font-size="14"><tspan x="846" dy="0">同实验同任务同来源、材料改变、条件一致</tspan></text></g><g id="UI-10-E09"><rect x="264" y="488" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="280" y="514" font-size="18"><tspan x="280" dy="0">E09  证据状态</tspan></text><text x="280" y="541" font-size="14"><tspan x="280" dy="0">verified当前指纹一致</tspan></text></g><g id="UI-10-E10"><rect x="830" y="488" width="542" height="72" rx="6" fill="#f3f8f9" stroke="#c9dce2" /><text x="846" y="514" font-size="18"><tspan x="846" dy="0">E10  核验时间</tspan></text><text x="846" y="541" font-size="14"><tspan x="846" dy="0">UTC ISO时间，表示关联时核验时间</tspan></text></g><text x="264" y="930" font-size="17"><tspan x="264" dy="0">AC-04 / AC-06 / AC-07 / AC-08 · 元素规则见PRD四列表</tspan></text></g></svg>