[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adoptlab"
version = "0.2.0"
description = "Versioned onboarding experiments with independently verified MCP tasks"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "httpx>=0.28,<1", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]
competitive = ["langfuse>=4,<5"]

[project.scripts]
adoptlab = "adoptlab.cli:main"

[tool.setuptools.package-data]
adoptlab = ["templates/*.html", "static/*", "data/*.json"]

[tool.setuptools.packages.find]
include = ["adoptlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
